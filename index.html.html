function timeReply(t,c){const m=t.match(/(오전|오후|저녁|밤|새벽|낮)?\s*(\d{1,2})\s*시(?!간)(?:\s*(반)|\s*(\d{1,2})\s*분)?/);if(!m)return '';
 let h=+m[2],ap=m[1];if(h>24)return '';
 if(ap=='오후'||ap=='저녁'||ap=='밤'){if(h<12)h+=12}else if(ap=='오전'||ap=='새벽'){if(h==12)h=0}else if(h<=8)h+=12;
 const mi=m[3]?'30분':m[4]?m[4]+'분':'',day=(t.match(/오늘|내일|모레|월요일|화요일|수요일|목요일|금요일|토요일|일요일|주말/)||[''])[0],lab=(day?day+' ':'')+(h<12?'오전 ':'오후 ')+(h%12||12)+'시'+(mi?' '+mi:'');
 if(!c)return h>=9&&h<21?'네, '+lab+' 괜찮아요. 기다리겠습니다.':'';
 if(h>=21||h<9)return lab+(h>=21?'는 너무 늦어서 어려워요.':'는 너무 이른 시간이라 어려워요.')+' 방문은 오전 9시~오후 9시 사이로 부탁드려요.';
 return '네, '+lab+' 가능해요. 그때 뵙겠습니다.'}
function autoReply(c,t){const k=a=>a.some(w=>t.includes(w));const tr=timeReply(t,c);if(tr)return tr;
 if(c){if(k(['견적','가격','얼마','비용']))return '사진 기준으로 예상 견적 범위 안에서 확정 견적을 보내드릴게요. 콜을 보내주시면 바로 확인합니다.';
  if(k(['시간','언제','방문','픽업']))return '내일 오전이나 모레 오후 1시 이후 가능해요. 편하신 시간대를 알려주세요.';
  if(k(['사진','모델']))return '사진 확인했어요. 모델명이 보이게 한 장만 더 부탁드려요.';

  return '네, 확인했습니다. 말씀해주신 내용으로 맞춰서 진행할게요.'}
 if(k(['견적','가격','비용']))return '네, 확인했어요. 안전결제로 진행하겠습니다.';
 if(k(['시간','언제','방문','오전','오후']))return '네, 그 시간 괜찮아요. 기다리겠습니다.';

 (inc?`<div class="ov"></div><div class="sheet"><div class="grab"></div><span class="tag">💬 카카오 알림톡</span><h2 style="font-size:22px">새 수리 콜이 왔어요</h2><div class="card"><div class="row"><div class="av">${emo(inc.item)}</div><div class="grow"><b style="font-size:1.2em">${esc(inc.item)}</b> <span class="sub">${inc.dist}</span><div class="sub">${esc(inc.desc)}</div></div></div><div class="sub" style="margin-top:8px">희망 ${inc.tm}</div></div><div class="two"><button class="btn g" onclick="rejectReq(${inc.id})">거절</button><button class="btn" onclick="openDet(${inc.id})">상세 보기</button></div></div>`:'');
}
function openDet(id){const r=S.reqs.find(x=>x.id==id);if(LV[r.item]>TG){toast('마스터 등급 콜은 받을 수 없어요');return}r.seen=1;S.det=id;S.fin=r.fin||r.est;S.tab='detail';draw()}
function finAdj(dl,id){const r=S.reqs.find(x=>x.id==id),[lo,hi]=rg(r.est);S.fin=Math.min(hi,Math.max(lo,S.fin+dl));draw()}
function acceptReq(id){const r=S.reqs.find(x=>x.id==id);if(LV[r.item]>TG)return;r.st='결제대기';r.tech='박정호';r.fin=S.fin;S.det=id;
 if(r.who=='나')pushMsg(thr('박정호',r.item,'나'),'t',`확정 견적 ${won(r.fin)} 보내드렸어요. 확인 후 안전결제 부탁드려요.`);
 if(r.who!='나')setTimeout(()=>{if(r.st=='결제대기'){r.st='방식선택';toast('고객이 안전결제를 완료했어요');setTimeout(()=>{if(r.st=='방식선택'){r.mode=r.id%2?'방문':'픽업';r.st='예약확정';draw()}},1500)}},2500);
 toast('확정 견적을 보냈어요 · 고객 결제를 기다려요')}
function rejectReq(id){S.reqs.find(x=>x.id==id).rej=1;S.tab='list';toast('콜을 거절했어요')}
function nextSt(id){S.reqs.find(x=>x.id==id).st='수리중';draw()}
function vDet(){const r=S.reqs.find(x=>x.id==S.det);if(!r)return vList();const[lo,hi]=rg(r.est);
 const bad=`<div style="height:10px"></div><button class="btn g" onclick="S.tab='fail';draw()">수리 불가 처리</button>`,fb=()=>`<div class="card"><div class="sub">확정 견적</div><div class="big">${won(r.fin)}</div></div>`,chat=`<div style="height:10px"></div><button class="btn g" onclick="techChat(${r.id})">💬 고객과 상담</button>`,md=r.mode=='픽업'?'📦 픽업 수리':'🚗 방문 수리';
 const act=r.st=='매칭중'?`<div class="card"><b>확정 견적 입력</b><div class="sub" style="margin:2px 0 10px">예상 범위 ${won(lo)} ~ ${won(hi)} (±20%) 안에서만 입력돼요</div><div class="fin"><button onclick="finAdj(-1000,${r.id})">−</button><b>${won(S.fin)}</b><button onclick="finAdj(1000,${r.id})">+</button></div></div><div class="two"><button class="btn g" onclick="rejectReq(${r.id})">거절</button><button class="btn" onclick="acceptReq(${r.id})">수락</button></div>`
 :r.st=='결제대기'?fb()+`<div class="card"><div class="sub">⏳ 고객이 안전결제를 하면 다음 단계로 넘어가요</div></div>`+chat
 :r.st=='방식선택'?fb()+`<div class="card"><div class="sub">🔒 안전결제 완료 · 고객이 방문/픽업 수리를 고르는 중이에요</div></div>`
 :r.st=='예약확정'?fb()+`<div class="sub" style="margin-bottom:10px">🔒 안전결제 완료 · ${md}</div><button class="btn" onclick="nextSt(${r.id})">${r.mode=='픽업'?'수거 완료 · 수리 시작':'방문 · 수리 시작'}</button>`+chat+bad
 :r.st=='수리중'?fb()+`<div class="sub" style="margin-bottom:10px">${md}</div><button class="btn" onclick="S.tab='done';draw()">완료 입력</button>`+bad
 :fb()+`<div class="card"><div class="sub">⏳ 고객의 작동 확인(구매확정)을 기다리고 있어요. 확정되면 90%가 지급돼요.</div></div>`;
 return back('list')+`<div class="body"><div class="card"><div class="row"><div class="av">${emo(r.item)}</div><div class="grow"><b style="font-size:1.2em">${esc(r.item)}</b><div class="sub">${esc(r.who)} · ${r.dist} · ${r.tm}</div></div></div><div style="margin:12px 0">${esc(r.desc)}</div>${r.md||r.lb?`<div class="sub" style="margin-bottom:8px">모델명 ${r.md?esc(r.md):'(라벨 사진 첨부)'}</div>`:''}${r.lb?`<img src="${r.lb}" alt="" style="width:100%;border-radius:12px;margin-bottom:10px">`:''}${r.img?`<img src="${r.img}" alt="" style="width:100%;border-radius:12px;margin-bottom:10px">`:''}<div class="sub">사전 예상 견적</div><b>${won(lo)} ~ ${won(hi)}</b></div>
 <button class="btn g" onclick="say('${r.item} 수리 콜입니다. 거리 ${r.dist}. 희망 ${r.tm}. 예상 견적 ${lo}원에서 ${hi}원.')">🔊 음성 안내</button><div style="height:10px"></div>${act}</div>`;
}
function vDone(){const r=S.reqs.find(x=>x.id==S.det);return back('detail')+`<div class="body"><h2>수리 전·후 사진 (필수)</h2><div class="two">${[['b','수리 전'],['a','수리 후']].map(([k,l])=>`<div class="photo ${S.ph[k]?'has':''}" onclick="document.getElementById('p${k}').click()">${S.ph[k]?`<img src="${S.ph[k]}" alt="">`:ic('cam')+'<span>'+l+' 사진</span>'}</div><input type="file" id="p${k}" accept="image/*" hidden onchange="pickT(this,'${k}')">`).join('')}</div>
 <h2>수리 내역</h2>${chips(WK,S.work,n=>`S.work='${n}';draw()`)}
 <div class="card" style="margin-top:14px"><div class="sub">최종 견적 (안전결제 보관 중)</div><div class="big">${won(r.fin)}</div><div class="sub">제출하면 고객이 사진과 작동을 확인하고 구매확정해요. 확정 후 90%, 7일 보증 후 10%가 지급돼요.</div></div><button class="btn" onclick="finish()">완료 제출</button></div>`}
function finish(){const r=S.reqs.find(x=>x.id==S.det);if(!(S.ph.b&&S.ph.a)){toast('수리 전·후 사진을 직접 첨부해주세요');return}if(!S.work){toast('수리 내역을 선택해주세요');return}
 r.st='확인대기';r.work=S.work;r.pb=S.ph.b;r.pa=S.ph.a;S.ph={b:'',a:''};S.work='';S.tab='list';
 if(r.who!='나')setTimeout(()=>confirmDone(r.id,1),2500);toast('완료 제출 · 고객 구매확정을 기다려요')}
function vFail(){return back('detail')+`<div class="body"><h2>수리 불가 사유</h2>${chips(WHY,S.why,n=>`S.why='${n}';draw()`)}<div class="card" style="margin-top:14px"><div class="sub">사유가 기록되고 소비자에게 수거 안내가 전달돼요. 방문 진단비 ${won(DIAG)}이 정산돼요.</div></div><button class="btn" onclick="failIt()">수리 불가 제출</button></div>`}
function failIt(){const r=S.reqs.find(x=>x.id==S.det);if(!S.why){toast('사유를 선택해주세요');return}
 r.st='수리불가';r.why=S.why;S.settle.unshift({d:'11/04',item:r.item,amt:DIAG,w:'수리 불가 · 진단비',rid:r.id,s:2});S.why='';S.tab='pay';toast('수리 불가로 기록했어요')}
function vPay(){
 const t=techs[ME],pr=Math.round(t.c/NEED[0]*100),n90=a=>Math.round(a*.9),M=[['재수리율',t.m[0],10],['수락 후 취소율',t.m[1],5],['보증 청구율',t.m[2],8]];
 const paid=S.settle.reduce((a,s)=>a+(s.s==1?n90(s.amt):s.amt),0),held=S.settle.reduce((a,s)=>a+(s.s==1?s.amt-n90(s.amt):0),0),hold=S.reqs.filter(r=>r.tech=='박정호'&&['방식선택','예약확정','수리중','확인대기'].includes(r.st)).reduce((a,r)=>a+r.fin,0);
 return hd('인증 완료 · 장인 뱃지 🏅','정산·등급')+`<div class="body"><div class="card"><div class="row"><b class="grow" style="font-size:1.15em">현재 등급 <span class="tag">${GR[TG]}</span></b><span class="sub">⭐ ${t.r} · ${t.c}건</span></div>
 <div class="bar"><b style="width:${pr}%"></b></div><div class="sub">마스터 승급까지 수리 ${NEED[0]}건 · 평점 ${NEED[1]} 이상</div></div>
 <div class="card"><b>가입·인증</b>${['신분증·경력(재직·자격) 증빙','활동 지역·보유 공구 등록','안전교육 이수'].map(x=>`<div class="sum"><span class="sub">${x}</span><span class="tag">완료</span></div>`).join('')}</div>
 <div class="card"><b>사후관리 지표</b>${M.map(([l,v,lim])=>`<div class="sum"><span class="sub">${l} ${v}% / 기준 ${lim}%</span><span class="tag ${v>lim?'w':''}">${v>lim?'노출 제한':'정상'}</span></div>`).join('')}<div class="sub" style="margin-top:4px">기준 미달 시 노출 제한, 지속되면 퇴출돼요</div></div>
 <div class="card row"><div class="av">🧰</div><div class="grow"><b>공구 대여비</b><div class="sub">월 ${won(RENT)} · 매월 1일 자동 결제 · 다음 결제 12/01</div></div><span class="tag">이용 중</span></div>
 <div class="card"><div class="sub">지급 완료</div><div class="big">${won(paid)}</div><div class="sum"><span class="sub">보증기간 후 지급 예정 (10%)</span><b>${won(held)}</b></div><div class="sum"><span class="sub">🔒 안전결제 보관 중</span><b>${won(hold)}</b></div><div class="sub" style="margin-top:6px">기술자 수수료 0원 (매칭수수료 3%는 소비자 부담) · 후기는 정산과 별개로 평판에만 반영돼요</div></div>
 <h2>정산 내역</h2>`+S.settle.map((s,i)=>{const rr=s.rid&&S.reqs.find(x=>x.id==s.rid);return `<div class="card"><div class="row"><div class="grow"><b>${esc(s.item)}</b><div class="sub">${s.d} · ${esc(s.w)} · ${won(s.amt)}${rr&&rr.rv?' · ★ '+rr.rv:''}</div></div><span class="tag ${s.s==1?'w':''}">${s.s==1?'보증 대기':'지급 완료'}</span></div>${s.s==1?`<div class="sub" style="margin-top:6px">90% ${won(n90(s.amt))} 지급됨 · 잔여 ${won(s.amt-n90(s.amt))}는 7일 보증 후 지급</div>`:''}</div>`}).join('')+`</div>`;
}
setRole('c');setInterval(()=>{document.getElementById('clk').textContent=now()},30000);
</script>
</body>
</html>
